name: E2E Tests (Cypress)

on:
  push:
    branches: [ main, develop, e2e-cypress ]
    paths:
      - 'frontend/**'
      - 'backend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:  # Manual trigger

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Start backend server
      working-directory: ./backend
      run: |
        npm start &
        echo $! > backend.pid
      env:
        NODE_ENV: test
        PORT: 5000

    - name: Wait for backend to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:5000/health || curl -f http://localhost:5000; do sleep 2; done' || echo "Backend may not be ready"

    - name: Start frontend server
      working-directory: ./frontend
      run: |
        npm run build
        npm start &
        echo $! > frontend.pid
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        PORT: 3000

    - name: Wait for frontend to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

    - name: Run Cypress E2E tests
      working-directory: ./frontend
      run: npm run cypress:headless
      env:
        CYPRESS_BASE_URL: http://localhost:3000

    - name: Upload Cypress screenshots on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots
        path: frontend/cypress/screenshots
        retention-days: 7

    - name: Upload Cypress videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-videos
        path: frontend/cypress/videos
        retention-days: 7

    - name: Stop servers
      if: always()
      run: |
        if [ -f backend/backend.pid ]; then kill $(cat backend/backend.pid) || true; fi
        if [ -f frontend/frontend.pid ]; then kill $(cat frontend/frontend.pid) || true; fi
