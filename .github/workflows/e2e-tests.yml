name: E2E Tests (Cypress)

on:
  push:
    branches: [ main, develop, e2e-cypress ]
    paths:
      - 'frontend/**'
      - 'backend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:  # Manual trigger

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    # Add MongoDB service
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Seed test database
      working-directory: ./backend
      run: |
        node -e "
        const mongoose = require('mongoose');
        const bcrypt = require('bcryptjs');
        
        mongoose.connect('mongodb://localhost:27017/social-media-test')
          .then(async () => {
            console.log('Connected to test database');
            
            // Create User model
            const userSchema = new mongoose.Schema({
              username: String,
              email: String,
              password: String,
              isVerified: { type: Boolean, default: true },
              posts: [{ type: mongoose.Schema.Types.ObjectId, ref: 'Post' }],
              savedPosts: [{ type: mongoose.Schema.Types.ObjectId, ref: 'Post' }],
            });
            const User = mongoose.model('User', userSchema);
            
            // Check if test user exists
            const existingUser = await User.findOne({ email: 'onlyforstudy12hr@gamil.com' });
            if (!existingUser) {
              // Create test user
              const hashedPassword = await bcrypt.hash('123@Rider', 12);
              await User.create({
                username: 'Alia',
                email: 'onlyforstudy12hr@gamil.com',
                password: hashedPassword,
                isVerified: true,
                posts: [],
                savedPosts: []
              });
              console.log('✅ Test user created');
            } else {
              console.log('✅ Test user already exists');
            }
            
            await mongoose.connection.close();
            process.exit(0);
          })
          .catch(err => {
            console.error('❌ Database seed error:', err);
            process.exit(1);
          });
        "
      env:
        NODE_ENV: test

    - name: Start backend server
      working-directory: ./backend
      run: |
        npm start &
        echo $! > backend.pid
      env:
        NODE_ENV: test
        PORT: 5000
        DB: mongodb://localhost:27017/social-media-test
        JWT_SECRET: test-secret-key-for-ci-testing-only
        JWT_EXPIRES_IN: 7d
        JWT_COOKIE_EXPIRES_IN: 7
        EMAIL_HOST: smtp.test.com
        EMAIL_PORT: 587
        EMAIL_USER: test@test.com
        EMAIL_PASSWORD: testpassword
        EMAIL_FROM: test@test.com
        MODER8R_API_KEY: ${{ secrets.MODER8R_API_KEY || 'dummy-key-for-testing' }}

    - name: Wait for backend to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:5000/health || curl -f http://localhost:5000; do sleep 2; done' || echo "Backend may not be ready"

    - name: Start frontend server
      working-directory: ./frontend
      run: |
        npm run build
        npm start &
        echo $! > frontend.pid
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        PORT: 3000

    - name: Wait for frontend to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

    - name: Run Cypress E2E tests
      working-directory: ./frontend
      run: npm run cypress:headless
      env:
        CYPRESS_BASE_URL: http://localhost:3000

    - name: Upload Cypress screenshots on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots
        path: frontend/cypress/screenshots
        retention-days: 7

    - name: Upload Cypress videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-videos
        path: frontend/cypress/videos
        retention-days: 7

    - name: Stop servers
      if: always()
      run: |
        if [ -f backend/backend.pid ]; then kill $(cat backend/backend.pid) || true; fi
        if [ -f frontend/frontend.pid ]; then kill $(cat frontend/frontend.pid) || true; fi
