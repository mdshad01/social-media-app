name: Frontend Tests

on:
  push:
    branches: [ main, develop, e2e-cypress ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  workflow_dispatch:  # Manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Increase timeout for build
    
    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [20.x]  # Next.js 16 requires Node.js >=20.9.0

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint || echo "⚠️ Lint skipped"

    - name: Type check
      run: npm run type-check || npx tsc --noEmit || echo "⚠️ Type check skipped"

    - name: Build project
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1  # Fixed: Added /api/v1

    - name: Run Vitest unit tests
      run: npm run test:unit
      env:
        NODE_ENV: test

    - name: Run Vitest with coverage
      run: npm run test:coverage
      env:
        NODE_ENV: test
      if: matrix.node-version == '20.x'

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        files: ./frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
      if: matrix.node-version == '20.x'
